name: Deploy runner.textmode.art to GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Report toolchain
              run: node --version && npm --version

            - name: Install dependencies
              run: npm ci

            - name: Check
              run: npm run check
              env:
                  VITE_RUNNER_PARENT_ORIGINS: https://synth.textmode.art,https://editor.textmode.art
                  VITE_RUNNER_FALLBACK_URL: https://editor.textmode.art

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: apps/runner/dist

    deploy:
        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
