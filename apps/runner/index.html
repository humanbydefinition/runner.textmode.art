<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>runner.textmode.art</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .runner-activation-prompt {
            position: fixed;
            right: 8px;
            bottom: 8px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 196px;
            padding: 9px 11px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: rgba(24, 24, 27, 0.94);
            color: #f4f4f5;
            font: inherit;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            text-align: left;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 160ms ease-out, border-color 160ms ease-out;
        }

        .runner-activation-prompt:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(39, 39, 42, 0.97);
        }

        .runner-activation-prompt:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.72);
            outline-offset: 2px;
        }

        .runner-activation-prompt__title {
            font-size: 11px;
            font-weight: 600;
            line-height: 1.3;
        }

        .runner-activation-prompt__detail {
            color: #a1a1aa;
            font-size: 10px;
            line-height: 1.35;
        }

        @media (prefers-reduced-motion: reduce) {
            .runner-activation-prompt {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <script type="module" src="./src/engines/textmode/index.ts"></script>
</body>

</html>
